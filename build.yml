name: Build plugin JARs
on:
  workflow_dispatch:
  push:
    branches: [ main ]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Build both plugins
        run: mvn -B -ntp clean package
      - name: Upload JARs
        uses: actions/upload-artifact@v4
        with:
          name: FServerLobbySpawn-JARs
          path: |
            velocity/target/*.jar
            paper/target/*.jar
          if-no-files-found: error
